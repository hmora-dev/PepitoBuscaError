<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${pageTitle + ' · PepitoBuscaError'}">Company form</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('companies')}"></div>

<main class="page-shell narrow">
	<nav class="breadcrumbs" aria-label="Breadcrumb">
		<a th:href="@{/companies}">Companies</a>
		<span>/</span>
		<span th:text="${pageTitle}">Company form</span>
	</nav>

	<section class="content-panel">
		<div class="section-title">
			<div>
				<p class="eyebrow">Company record</p>
				<h1 th:text="${pageTitle}">Register company</h1>
			</div>
		</div>

		<form class="entity-form"
			  th:action="${company.idCompany == null} ? @{/companies/save} : @{/companies/update/{id}(id=${company.idCompany})}"
			  th:object="${company}" method="post">
			<div class="form-grid two">
				<label>
					<span>Company name</span>
					<input type="text" th:field="*{name}" placeholder="Acme Digital Services">
					<small class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
				</label>
				<label>
					<span>Sector</span>
					<input type="text" th:field="*{sector}" placeholder="Retail, healthcare, education">
					<small class="field-error" th:if="${#fields.hasErrors('sector')}" th:errors="*{sector}"></small>
				</label>
				<label>
					<span>Domain</span>
					<input type="text" th:field="*{domain}" placeholder="example.com">
					<small class="field-error" th:if="${#fields.hasErrors('domain')}" th:errors="*{domain}"></small>
				</label>
				<label>
					<span>Corporate email</span>
					<input type="email" th:field="*{corporateEmail}" placeholder="security@example.com">
					<small class="field-error" th:if="${#fields.hasErrors('corporateEmail')}" th:errors="*{corporateEmail}"></small>
				</label>
			</div>

			<div class="warning-box">
				<strong>Deletion warning:</strong>
				<span>Deleting a company also removes its analyses, indicators, and recommendations.</span>
			</div>

			<div class="form-actions">
				<a class="btn btn-ghost" th:href="@{/companies}">Cancel</a>
				<button class="btn btn-primary" type="submit">Save company</button>
			</div>
		</form>
	</section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
