<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="app-topbar" th:fragment="navbar(active)">

	<!-- Mobile: hamburger + brand -->
	<button id="mobile-menu-btn" type="button" aria-label="Open navigation">
		<i class="bi bi-list" style="font-size:18px"></i>
	</button>

	<a class="topbar-brand" th:href="@{/dashboard}">
		<span class="brand-mark">PB</span>
		<span>PepitoBuscaError</span>
	</a>

	<!-- Desktop: empty centre column (sidebar handles nav) -->
	<span></span>

	<!-- Right: primary CTA -->
	<a class="btn btn-primary btn-topbar" th:href="@{/companies/new}">
		<i class="bi bi-plus-lg"></i>
		<span>New company</span>
	</a>

</header>
</body>
</html>
