<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="app-topbar" th:fragment="navbar(active)">
	<a class="topbar-brand" th:href="@{/dashboard}">
		<span class="brand-mark">PB</span>
		<span>PepitoBuscaError</span>
	</a>
	<nav class="top-nav mobile-nav" aria-label="Main navigation">
		<a class="nav-pill" th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? ' active' : ''">
			<i class="bi bi-grid-1x2"></i>
			<span>Dashboard</span>
		</a>
		<a class="nav-pill" th:href="@{/companies}" th:classappend="${active == 'companies'} ? ' active' : ''">
			<i class="bi bi-buildings"></i>
			<span>Companies</span>
		</a>
		<a class="nav-pill" th:href="@{/analyses}" th:classappend="${active == 'analyses'} ? ' active' : ''">
			<i class="bi bi-activity"></i>
			<span>Analyses</span>
		</a>
		<a class="nav-pill" th:href="@{/indicators}" th:classappend="${active == 'indicators'} ? ' active' : ''">
			<i class="bi bi-shield-check"></i>
			<span>Indicators</span>
		</a>
		<a class="nav-pill" th:href="@{/recommendations}" th:classappend="${active == 'recommendations'} ? ' active' : ''">
			<i class="bi bi-lightning-charge"></i>
			<span>Recommendations</span>
		</a>
		<a class="nav-pill" th:href="@{/osint}" th:classappend="${active == 'osint'} ? ' active' : ''">
			<i class="bi bi-radar"></i>
			<span>OSINT</span>
		</a>
		<a class="nav-pill" th:href="@{/geolocation}" th:classappend="${active == 'geolocation'} ? ' active' : ''">
			<i class="bi bi-geo-alt"></i>
			<span>Geolocation</span>
		</a>
		<a class="nav-pill" th:href="@{/documentation}" th:classappend="${active == 'documentation'} ? ' active' : ''">
			<i class="bi bi-journal-text"></i>
			<span>Docs</span>
		</a>
	</nav>
	<a class="btn btn-primary btn-topbar" th:href="@{/companies/new}">
		<i class="bi bi-plus-lg"></i>
		<span>New company</span>
	</a>
</header>
</body>
</html>
