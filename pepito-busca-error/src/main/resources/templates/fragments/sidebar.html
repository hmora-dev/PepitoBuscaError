<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="app-sidebar" th:fragment="sidebar(active)" aria-label="Main navigation">

	<a class="sidebar-brand" th:href="@{/dashboard}">
		<span class="brand-mark">PB</span>
		<span>
			<strong>PepitoBuscaError</strong>
			<small>Cyber Risk Intelligence</small>
		</span>
	</a>

	<nav class="sidebar-nav">
		<a th:href="@{/dashboard}"
		   th:classappend="${active == 'dashboard'} ? ' active' : ''">
			<i class="bi bi-grid-1x2-fill"></i>
			<span>Dashboard</span>
		</a>
		<a th:href="@{/companies}"
		   th:classappend="${active == 'companies'} ? ' active' : ''">
			<i class="bi bi-buildings-fill"></i>
			<span>Companies</span>
		</a>
		<a th:href="@{/analyses}"
		   th:classappend="${active == 'analyses'} ? ' active' : ''">
			<i class="bi bi-activity"></i>
			<span>Analyses</span>
		</a>
		<a th:href="@{/indicators}"
		   th:classappend="${active == 'indicators'} ? ' active' : ''">
			<i class="bi bi-shield-fill-check"></i>
			<span>Indicators</span>
		</a>
		<a th:href="@{/recommendations}"
		   th:classappend="${active == 'recommendations'} ? ' active' : ''">
			<i class="bi bi-lightning-charge-fill"></i>
			<span>Recommendations</span>
		</a>
		<a th:href="@{/osint}"
		   th:classappend="${active == 'osint'} ? ' active' : ''">
			<i class="bi bi-radar"></i>
			<span>OSINT</span>
		</a>
		<a th:href="@{/geolocation}"
		   th:classappend="${active == 'geolocation'} ? ' active' : ''">
			<i class="bi bi-geo-alt-fill"></i>
			<span>Geolocation</span>
		</a>
		<a th:href="@{/documentation}"
		   th:classappend="${active == 'documentation'} ? ' active' : ''">
			<i class="bi bi-journal-code"></i>
			<span>Docs</span>
		</a>
	</nav>

	<div class="sidebar-card">
		<span class="status-dot"></span>
		<div>
			<strong>Spring Boot + MySQL</strong>
			<small>Backend online</small>
		</div>
	</div>

</aside>
</body>
</html>
